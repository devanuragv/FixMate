<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FixMate | Profile</title>

<link rel="stylesheet" href="css/profile.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="profile-container">

<div class="profile-card">

<div class="profile-header">

<div class="avatar">
👤
</div>

<h1>My Profile</h1>

</div>

<form id="profileForm">

<div class="input-group">

<label>Name</label>

<input
type="text"
id="name"
required
>

</div>

<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
readonly
>

</div>

<div class="input-group">

<label>Phone</label>

<input
type="text"
id="phone"
>

</div>

<div class="input-group">

<label>City</label>

<input
type="text"
id="city"
>

</div>

<div class="input-group">

<label>State</label>

<input
type="text"
id="state"
>

</div>

<div class="input-group">

<label>Pincode</label>

<input
type="text"
id="pincode"
>

</div>

<button
type="submit"
class="save-btn"
>

Update Profile

</button>

<a
href="dashboard.html"
class="back-btn"
>

Back To Dashboard

</a>

</form>

</div>

</div>

<script src="js/profile.js"></script>

</body>
</html>
