<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixMate Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="sidebar">

        <div class="logo">
            <h2>
                <span class="logo-fix">Fix</span><span class="logo-mate">Mate</span>
            </h2>
        </div>

        <ul>

            <li class="active">
                Dashboard
            </li>

            <li onclick="location.href='booking.html'">
                Book Service
            </li>

            <li onclick="location.href='history.html'">
                Booking History
            </li>

            <li onclick="location.href='profile.html'">
                Profile
            </li>

            <li onclick="location.href='customer-support.html'">
                Customer Support
            </li>

            <li onclick="logout()">
                Logout
            </li>

        </ul>

    </div>


    <div class="main-content">

        <div class="topbar">

            <h1>
                Welcome,
                <span id="userName">User</span>
            </h1>

        </div>


        <!-- =========================================
             CURRENT / RECENT BOOKING
        ========================================== -->

        <div class="current-booking-section" id="currentBookingSection">

            <div class="current-booking-header">
                <div>
                    <span class="current-booking-kicker">
                        RECENT SERVICE
                    </span>

                    <h2>
                        Your Last Booking
                    </h2>
                </div>
            </div>


            <div class="current-booking-card" id="currentBookingCard">

                <!-- Filled by dashboard.js -->

            </div>

        </div>


        <!-- =========================================
             BOOKING STATS
        ========================================== -->

        <div class="stats-grid">

            <div class="stat-card">

                <h3>
                    Total Bookings
                </h3>

                <p id="totalBookings">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>
                    Pending
                </h3>

                <p id="pendingBookings">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>
                    Completed
                </h3>

                <p id="completedBookings">
                    0
                </p>

            </div>

        </div>

    </div>


    <script src="js/dashboard.js"></script>

</body>

</html>
