<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FixMate | Register</title>

    <link rel="stylesheet"
        href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="auth-wrapper">

        <div class="auth-left">

            <div class="brand">
                <h1>FixMate</h1>
                <p>Book Trusted Home Services</p>
            </div>

            <img src="images/register-banner.png"
                alt="FixMate">

        </div>

        <div class="auth-right">

            <div class="auth-card">

                <h2>Create Account</h2>

                <p>
                    Join FixMate and manage your services
                    effortlessly.
                </p>

                <form id="registerForm">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text"
                            id="name"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email"
                            id="email"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text"
                            id="phone"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password"
                            id="password"
                            required>
                    </div>

                    <button type="submit"
                        class="primary-btn">

                        Register

                    </button>

                </form>

                <div class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
