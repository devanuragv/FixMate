<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FixMate | Register</title>

    <link rel="stylesheet"
        href="css/login.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="auth-wrapper">

        <!-- ================= LEFT SIDE ================= -->

        <div class="auth-left">

            <!-- BRAND -->

            <div class="brand">

                <h1>
                    Fix<span>Mate</span>
                </h1>

                <p>
                    Book Trusted Home Services
                </p>

            </div>


            <!-- BACKGROUND FIXMATE -->

            <div class="fixmate-background">
                FIXMATE
            </div>


            <!-- CENTER CHARACTER -->

            <div class="hero-area">

                <div class="handyman">

                    <!-- HELMET -->

                    <div class="helmet">

                        <div class="helmet-logo">
                            🔧
                        </div>

                    </div>


                    <!-- HEAD -->

                    <div class="head">

                        <div class="hair"></div>

                        <div class="eyebrow eyebrow-left"></div>
                        <div class="eyebrow eyebrow-right"></div>

                        <div class="eye eye-left">
                            <span></span>
                        </div>

                        <div class="eye eye-right">
                            <span></span>
                        </div>

                        <div class="nose"></div>

                        <div class="smile"></div>

                    </div>


                    <!-- BODY -->

                    <div class="body">

                        <div class="suspender suspender-left"></div>
                        <div class="suspender suspender-right"></div>

                        <div class="suspender-button button-left"></div>
                        <div class="suspender-button button-right"></div>

                        <div class="shirt-logo">
                            Fix<span>Mate</span>
                        </div>

                    </div>


                    <!-- LEFT ARM -->

                    <div class="arm left-arm">

                        <div class="normal-hand"></div>

                    </div>


                    <!-- WAVING ARM -->

                    <div class="wave-arm">

                        <div class="wave-hand">

                            <div class="palm"></div>

                            <!-- FIVE FINGERS -->

                            <div class="finger finger-1"></div>
                            <div class="finger finger-2"></div>
                            <div class="finger finger-3"></div>
                            <div class="finger finger-4"></div>
                            <div class="finger finger-5"></div>

                        </div>

                    </div>


                    <!-- TOOL BELT -->

                    <div class="tool-belt">

                        <div class="belt-buckle"></div>

                        <div class="tool-box">
                            🔧
                        </div>

                    </div>


                    <!-- LEGS -->

                    <div class="leg left-leg"></div>
                    <div class="leg right-leg"></div>

                    <div class="shoe left-shoe"></div>
                    <div class="shoe right-shoe"></div>

                </div>

            </div>


            <!-- TAGLINE -->

            <div class="brand-tag">

                <span class="dot"></span>

                <span>
                    Reliable service. Every fix.
                </span>

            </div>

        </div>


        <!-- ================= RIGHT SIDE ================= -->

        <div class="auth-right">

            <div class="auth-card">

                <div class="card-header">

                    <span class="welcome-tag">
                        JOIN FIXMATE
                    </span>

                    <h2>
                        Create Account
                    </h2>

                    <p>
                        Join FixMate and manage your services
                        effortlessly.
                    </p>

                </div>


                <!-- KEEP REGISTER FORM ID -->

                <form id="registerForm">


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                👤
                            </span>

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter your full name"
                                required>

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                ✉
                            </span>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required>

                        </div>

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                📱
                            </span>

                            <input
                                type="text"
                                id="phone"
                                placeholder="Enter your phone number"
                                required>

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required>

                        </div>

                    </div>


                    <!-- REGISTER -->

                    <button
                        type="submit"
                        class="primary-btn">

                        <span>
                            Create Account
                        </span>

                        <span class="btn-arrow">
                            →
                        </span>

                    </button>

                </form>


                <!-- DIVIDER -->

                <div class="divider">
                    <span>OR</span>
                </div>

                <button
                    type="button"
                    id="googleRegisterBtn"
                    class="google-btn">

                    <img
                        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                        class="google-icon"
                        alt="Google">

                    <span>Continue with Google</span>
                </button>

                </br>

                <!-- LOGIN -->

                <div class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

<!-- FixMate Firebase Configuration -->
<script src="js/firebase-config.js"></script>

<!-- FixMate Authentication -->
<script src="js/auth.js"></script>

</body>

</html>
