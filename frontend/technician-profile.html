<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Technician Profile
</title>

<link
rel="stylesheet"
href="css/technician-profile.css">

</head>

<body>

<div class="profile-container">

    <div class="profile-card">

        <div class="profile-header">

            <div class="profile-avatar">
                👨‍🔧
            </div>

            <h1>
                Technician Profile
            </h1>

            <p>
                Manage your profile information
            </p>

        </div>

        <form id="profileForm">

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                type="text"
                id="name"
                required>

            </div>

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                type="email"
                id="email"
                readonly>

            </div>

            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                type="text"
                id="phone">

            </div>

            <div class="form-group">

                <label>
                    Service Type
                </label>

                <input
                type="text"
                id="serviceType"
                readonly>

            </div>

            <div class="form-group">

                <label>
                    City
                </label>

                <input
                type="text"
                id="city">

            </div>

            <div class="form-group">

                <label>
                    State
                </label>

                <input
                type="text"
                id="state">

            </div>

            <div class="form-group">

                <label>
                    Pincode
                </label>

                <input
                type="text"
                id="pincode">

            </div>

            <div class="form-group">

                <label>
                    Experience (Years)
                </label>

                <input
                type="number"
                id="experience"
                min="0">

            </div>

            <div class="form-group">


            <div class="button-group">

                <button
                type="submit"
                class="save-btn">

                    Save Changes

                </button>

                <button
                type="button"
                class="back-btn"
                onclick="
                window.location.href=
                'technician-dashboard.html'
                ">

                    Back To Dashboard

                </button>

            </div>

        </form>

    </div>

</div>

<div id="toast"></div>

<script src="js/technician-profile.js"></script>

</body>

</html>
